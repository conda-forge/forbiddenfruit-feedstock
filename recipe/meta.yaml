{% set name = "forbiddenfruit" %}
{% set version = "0.1.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/forbiddenfruit-{{ version }}.tar.gz
  sha256: 786de92f86b9bcb028286ac96911740f6bf2bbe8f4604c8a3ee1ad6b362d4df9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7

test:
  imports:
    - forbiddenfruit
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/clarete/forbiddenfruit
  summary: Patch python built-in objects
  license: LGPL-3.0-only & MIT
  license_file:
    - COPYING
    - COPYING.mit

extra:
  recipe-maintainers:
    - aymondebroglie
